name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bank-api .

      - name: Run tests
        run: |
          docker run --rm \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_KEY=test-key \
            bank-api pytest